# 推送到 main 后自动构建并发布到 GitHub Pages
# 只需在仓库 Settings → Pages → Source 选「GitHub Actions」（或用自动开启）。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 就跑动力引擎测试（题库校验 + 候选字生成）
        run: node test/engine.test.cjs

      - name: 生成图标
        run: node tools/make-icons.mjs

      - name: 打包（题库 + 引擎 + 界面 内联成单文件）
        run: node build.mjs

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4